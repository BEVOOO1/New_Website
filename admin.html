<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Bavly CMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=Tenor+Sans&family=Cinzel:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07080f;--bg2:#0a0c16;--panel:#0e1018;
  --glass:rgba(255,255,255,.035);--glass2:rgba(255,255,255,.06);
  --border:rgba(255,255,255,.07);--border-gold:rgba(212,175,120,.28);
  --gold:#d4af78;--gold-light:#e8cfa0;--gold-dim:rgba(212,175,120,.45);
  --text:#f0ece4;--text-muted:rgba(240,236,228,.55);--text-dim:rgba(240,236,228,.32);
  --green:rgba(56,200,130,.9);--red:rgba(220,80,80,.9);--blue:rgba(100,160,255,.9);
  --radius:12px;--sidebar:260px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;font-family:'Tenor Sans',serif;}
body{background:var(--bg);color:var(--text);display:flex;min-height:100vh;overflow:hidden;}

.sidebar{width:var(--sidebar);background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;height:100vh;position:fixed;left:0;top:0;z-index:100;overflow-y:auto;}
.sidebar-brand{padding:1.8rem 1.5rem 1.4rem;border-bottom:1px solid var(--border);}
.sidebar-logo{font-family:'Cinzel',serif;font-size:1.3rem;font-weight:600;color:var(--text);text-decoration:none;display:block;}
.sidebar-logo span{color:var(--gold);}
.sidebar-sub{font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;color:var(--text-dim);margin-top:.3rem;}
.sidebar-nav{padding:1rem 0;flex:1;}
.sidebar-section{font-size:.58rem;letter-spacing:.2em;text-transform:uppercase;color:var(--text-dim);padding:.6rem 1.5rem .4rem;margin-top:.5rem;}
.sidebar-link{display:flex;align-items:center;gap:.8rem;padding:.75rem 1.5rem;color:var(--text-muted);text-decoration:none;font-size:.8rem;letter-spacing:.05em;transition:all .2s;border-left:2px solid transparent;cursor:pointer;background:none;border-top:none;border-right:none;border-bottom:none;width:100%;text-align:left;}
.sidebar-link:hover{color:var(--text);background:rgba(255,255,255,.03);}
.sidebar-link.active{color:var(--gold);background:rgba(212,175,120,.06);border-left-color:var(--gold);}
.sidebar-link .sl-icon{font-size:1rem;width:20px;text-align:center;flex-shrink:0;}
.sidebar-link .sl-count{margin-left:auto;font-size:.65rem;background:rgba(212,175,120,.15);border:1px solid var(--border-gold);color:var(--gold);padding:.1rem .5rem;border-radius:100px;}
.sidebar-footer{padding:1.2rem 1.5rem;border-top:1px solid var(--border);}
.sidebar-footer a{display:block;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--text-dim);text-decoration:none;padding:.5rem 0;transition:color .2s;}
.sidebar-footer a:hover{color:var(--gold);}

.main{margin-left:var(--sidebar);flex:1;height:100vh;overflow-y:auto;display:flex;flex-direction:column;}
.topbar{padding:1.2rem 2.5rem;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:rgba(7,8,15,.8);backdrop-filter:blur(12px);position:sticky;top:0;z-index:50;}
.topbar-title{font-family:'Playfair Display',serif;font-size:1.4rem;font-weight:400;}
.topbar-title em{font-style:italic;color:var(--gold);}
.topbar-actions{display:flex;gap:.8rem;align-items:center;}
.btn{display:inline-flex;align-items:center;gap:.5rem;padding:.6rem 1.3rem;border-radius:8px;font-family:'Tenor Sans',sans-serif;font-size:.74rem;letter-spacing:.08em;cursor:pointer;transition:all .25s;border:1px solid var(--border);background:var(--glass);color:var(--text-muted);}
.btn:hover{background:var(--glass2);color:var(--text);border-color:rgba(255,255,255,.15);}
.btn-primary{background:linear-gradient(135deg,var(--gold),var(--gold-light));color:#07080f;border-color:transparent;font-weight:700;}
.btn-primary:hover{box-shadow:0 6px 24px rgba(212,175,120,.35);transform:translateY(-1px);}
.btn-danger{border-color:rgba(220,80,80,.3);color:rgba(220,80,80,.7);}
.btn-danger:hover{background:rgba(220,80,80,.1);color:rgba(220,80,80,1);border-color:rgba(220,80,80,.5);}
.btn-sm{padding:.4rem .9rem;font-size:.68rem;}

.content{padding:2rem 2.5rem;flex:1;}

.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-bottom:2rem;}
.stat-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:1.5rem;transition:all .3s;cursor:pointer;}
.stat-card:hover{border-color:var(--border-gold);transform:translateY(-2px);}
.stat-icon{font-size:1.6rem;margin-bottom:.8rem;}
.stat-num{font-family:'Cinzel',serif;font-size:2rem;font-weight:600;color:var(--gold);line-height:1;}
.stat-label{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--text-dim);margin-top:.4rem;}

.table-wrap{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
.table-head{padding:1.2rem 1.5rem;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;}
.table-head-title{font-family:'Cinzel',serif;font-size:.9rem;letter-spacing:.08em;color:var(--text);}
.table-search{background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:8px;padding:.5rem 1rem;font-family:'Tenor Sans',sans-serif;font-size:.78rem;color:var(--text);outline:none;transition:border .2s;width:200px;}
.table-search:focus{border-color:var(--border-gold);}
.table-search::placeholder{color:var(--text-dim);}
table{width:100%;border-collapse:collapse;}
th{font-family:'Tenor Sans',sans-serif;font-size:.65rem;letter-spacing:.15em;text-transform:uppercase;color:var(--text-dim);padding:.9rem 1.5rem;text-align:left;border-bottom:1px solid var(--border);background:rgba(255,255,255,.02);}
td{padding:.9rem 1.5rem;border-bottom:1px solid rgba(255,255,255,.035);font-size:.8rem;color:var(--text-muted);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:rgba(255,255,255,.02);}
.td-title{color:var(--text);font-size:.85rem;}
.td-badge{display:inline-flex;padding:.2rem .7rem;border-radius:100px;font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;border:1px solid;white-space:nowrap;}
.badge-live{color:#38d9a9;border-color:rgba(56,217,169,.3);background:rgba(56,217,169,.07);}
.badge-draft{color:var(--gold-dim);border-color:var(--border-gold);background:rgba(212,175,120,.06);}
.badge-featured{color:#a78bfa;border-color:rgba(167,139,250,.3);background:rgba(167,139,250,.07);}
.td-actions{display:flex;gap:.4rem;align-items:center;}
.action-btn{background:none;border:1px solid var(--border);border-radius:6px;padding:.3rem .7rem;font-size:.68rem;color:var(--text-dim);cursor:pointer;transition:all .2s;font-family:'Tenor Sans',sans-serif;letter-spacing:.05em;}
.action-btn:hover{background:var(--glass2);color:var(--text);border-color:rgba(255,255,255,.15);}
.action-btn.edit:hover{color:var(--gold);border-color:var(--border-gold);}
.action-btn.del:hover{color:rgba(220,80,80,.9);border-color:rgba(220,80,80,.3);}
.thumb-preview{width:44px;height:44px;border-radius:6px;object-fit:cover;border:1px solid var(--border);}
.thumb-ph{width:44px;height:44px;border-radius:6px;background:var(--glass);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:1.2rem;}

.modal-overlay{position:fixed;inset:0;z-index:500;background:rgba(7,8,15,.7);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;}
.modal-overlay.open{display:flex;}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:16px;width:min(780px,96vw);max-height:92vh;overflow-y:auto;position:relative;box-shadow:0 30px 80px rgba(0,0,0,.6);}
.modal-header{padding:1.8rem 2rem 1.2rem;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--panel);z-index:10;}
.modal-title{font-family:'Playfair Display',serif;font-size:1.3rem;font-weight:400;}
.modal-title em{font-style:italic;color:var(--gold);}
.modal-close{background:none;border:1px solid var(--border);border-radius:6px;width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-muted);transition:all .2s;font-size:1.1rem;}
.modal-close:hover{background:var(--glass2);color:var(--text);}
.modal-body{padding:1.8rem 2rem;}
.modal-footer{padding:1.2rem 2rem;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:.8rem;position:sticky;bottom:0;background:var(--panel);}

.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:1.2rem;}
.field{display:flex;flex-direction:column;gap:.5rem;}
.field.full{grid-column:1/-1;}
.field label{font-size:.68rem;letter-spacing:.15em;text-transform:uppercase;color:var(--text-dim);}
.field input,.field select,.field textarea{background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:8px;padding:.75rem 1rem;font-family:'Tenor Sans',sans-serif;font-size:.85rem;color:var(--text);outline:none;transition:border .2s;width:100%;}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--border-gold);}
.field input::placeholder,.field textarea::placeholder{color:var(--text-dim);}
.field select option{background:var(--panel);}
.field textarea{resize:vertical;min-height:90px;line-height:1.7;}
.rich-textarea{min-height:200px;font-size:.82rem;}
.field-hint{font-size:.65rem;color:var(--text-dim);margin-top:.2rem;}

/* SECTION DIVIDER in form */
.form-section{grid-column:1/-1;border-top:1px solid var(--border);padding-top:1.2rem;margin-top:.5rem;}
.form-section-title{font-size:.65rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-bottom:1rem;display:flex;align-items:center;gap:.6rem;}
.form-section-title::before{content:'';width:16px;height:1px;background:var(--gold);}

/* IMAGE UPLOAD */
.upload-area{border:1px dashed rgba(212,175,120,.25);border-radius:10px;padding:1.5rem;text-align:center;cursor:pointer;transition:all .3s;position:relative;background:rgba(212,175,120,.02);}
.upload-area:hover{border-color:var(--border-gold);background:rgba(212,175,120,.05);}
.upload-area input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;}
.upload-area-icon{font-size:1.4rem;margin-bottom:.4rem;opacity:.4;}
.upload-area-text{font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--text-dim);}
.upload-area-sub{font-size:.62rem;color:var(--text-dim);margin-top:.3rem;opacity:.6;}
.upload-preview{max-width:100%;max-height:160px;border-radius:8px;margin-top:.8rem;object-fit:contain;border:1px solid var(--border);}

/* DYNAMIC LIST (PDFs, extra links, images) */
.dyn-list{display:flex;flex-direction:column;gap:.6rem;margin-top:.6rem;}
.dyn-item{display:flex;align-items:center;gap:.6rem;padding:.7rem 1rem;background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:8px;}
.dyn-item-info{flex:1;min-width:0;}
.dyn-item-label{font-size:.78rem;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.dyn-item-url{font-size:.65rem;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.dyn-remove{background:none;border:1px solid rgba(220,80,80,.3);border-radius:5px;padding:.25rem .6rem;font-size:.65rem;color:rgba(220,80,80,.6);cursor:pointer;transition:all .2s;flex-shrink:0;}
.dyn-remove:hover{background:rgba(220,80,80,.1);color:rgba(220,80,80,.9);}
.add-row{display:grid;grid-template-columns:1fr 1fr auto;gap:.5rem;margin-top:.5rem;}
.add-row.single{grid-template-columns:1fr auto;}
.add-row input{background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:8px;padding:.6rem .9rem;font-family:'Tenor Sans',sans-serif;font-size:.8rem;color:var(--text);outline:none;transition:border .2s;}
.add-row input:focus{border-color:var(--border-gold);}
.add-row input::placeholder{color:var(--text-dim);}
.add-row .btn-add{background:rgba(212,175,120,.1);border:1px solid var(--border-gold);border-radius:8px;padding:.6rem 1rem;font-size:.72rem;color:var(--gold);cursor:pointer;white-space:nowrap;transition:all .2s;font-family:'Tenor Sans',sans-serif;}
.add-row .btn-add:hover{background:rgba(212,175,120,.2);}

/* IMAGE MULTI GALLERY */
.img-gallery-preview{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem;margin-top:.6rem;}
.img-gallery-thumb{aspect-ratio:1;border-radius:8px;overflow:hidden;position:relative;border:1px solid var(--border);}
.img-gallery-thumb img{width:100%;height:100%;object-fit:cover;}
.img-gallery-thumb .img-remove{position:absolute;top:.25rem;right:.25rem;background:rgba(7,8,15,.8);border:1px solid rgba(220,80,80,.4);border-radius:4px;width:20px;height:20px;display:flex;align-items:center;justify-content:center;font-size:.65rem;color:rgba(220,80,80,.8);cursor:pointer;transition:all .2s;}
.img-gallery-thumb .img-remove:hover{background:rgba(220,80,80,.2);}

/* TOGGLE */
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:.8rem 0;}
.toggle-label{font-size:.78rem;color:var(--text-muted);}
.toggle{position:relative;width:42px;height:24px;}
.toggle input{opacity:0;width:0;height:0;}
.toggle-track{position:absolute;inset:0;background:rgba(255,255,255,.1);border-radius:100px;cursor:pointer;transition:.3s;border:1px solid var(--border);}
.toggle input:checked+.toggle-track{background:rgba(212,175,120,.4);border-color:var(--border-gold);}
.toggle-track::before{content:'';position:absolute;width:16px;height:16px;border-radius:50%;background:var(--text-dim);bottom:3px;left:3px;transition:.3s;}
.toggle input:checked+.toggle-track::before{transform:translateX(18px);background:var(--gold);}

/* RICH TEXT TOOLBAR */
.rich-toolbar{display:flex;gap:.3rem;flex-wrap:wrap;padding:.5rem;background:rgba(255,255,255,.03);border:1px solid var(--border);border-bottom:none;border-radius:8px 8px 0 0;}
.rich-btn{background:none;border:1px solid var(--border);border-radius:4px;padding:.2rem .6rem;font-size:.75rem;color:var(--text-dim);cursor:pointer;transition:all .2s;font-family:'Tenor Sans',sans-serif;}
.rich-btn:hover{background:var(--glass2);color:var(--text);}
.rich-field{border-top-left-radius:0;border-top-right-radius:0;}

.table-empty{padding:4rem;text-align:center;color:var(--text-dim);}
.table-empty-icon{font-size:2.5rem;margin-bottom:.8rem;opacity:.3;}
.table-empty-text{font-size:.8rem;letter-spacing:.1em;}

.toast{position:fixed;bottom:2rem;right:2rem;z-index:9999;padding:.9rem 1.6rem;border-radius:10px;font-family:'Tenor Sans',sans-serif;font-size:.8rem;letter-spacing:.05em;backdrop-filter:blur(12px);box-shadow:0 8px 30px rgba(0,0,0,.4);transition:all .3s;pointer-events:none;}

.confirm-dialog{position:fixed;inset:0;z-index:600;background:rgba(7,8,15,.8);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;}
.confirm-dialog.open{display:flex;}
.confirm-box{background:var(--panel);border:1px solid rgba(220,80,80,.3);border-radius:14px;padding:2rem;max-width:380px;text-align:center;}
.confirm-icon{font-size:2rem;margin-bottom:1rem;}
.confirm-title{font-family:'Playfair Display',serif;font-size:1.2rem;margin-bottom:.5rem;}
.confirm-text{font-size:.8rem;color:var(--text-dim);margin-bottom:1.5rem;line-height:1.6;}
.confirm-actions{display:flex;gap:.8rem;justify-content:center;}

@media(max-width:900px){
  .sidebar{transform:translateX(-100%);transition:transform .3s;}
  .sidebar.open{transform:translateX(0);}
  .main{margin-left:0;}
  .stats-grid{grid-template-columns:1fr 1fr;}
  .form-grid{grid-template-columns:1fr;}
  .add-row{grid-template-columns:1fr auto;}
}
@media(max-width:600px){
  .stats-grid{grid-template-columns:1fr;}
  .content{padding:1.5rem;}
  .topbar{padding:1rem 1.5rem;}
  .img-gallery-preview{grid-template-columns:repeat(3,1fr);}
}
</style>
</head>
<body>

<aside class="sidebar" id="sidebar">
  <div class="sidebar-brand">
    <a href="index.html" class="sidebar-logo">B<span>.</span> Admin</a>
    <div class="sidebar-sub">Content Management</div>
  </div>
  <nav class="sidebar-nav">
    <div class="sidebar-section">Overview</div>
    <button class="sidebar-link active" data-panel="dashboard"><span class="sl-icon">📊</span> Dashboard</button>
    <div class="sidebar-section">Content</div>
    <button class="sidebar-link" data-panel="design"><span class="sl-icon">🎨</span> Design Posts<span class="sl-count" id="cnt-design">0</span></button>
    <button class="sidebar-link" data-panel="video"><span class="sl-icon">🎬</span> Video Works<span class="sl-count" id="cnt-video">0</span></button>
    <button class="sidebar-link" data-panel="violin"><span class="sl-icon">🎻</span> Violin<span class="sl-count" id="cnt-violin">0</span></button>
    <button class="sidebar-link" data-panel="competitions"><span class="sl-icon">🏆</span> Competitions<span class="sl-count" id="cnt-competitions">0</span></button>
    <button class="sidebar-link" data-panel="blog"><span class="sl-icon">📝</span> Blog Posts<span class="sl-count" id="cnt-blog">0</span></button>
    <button class="sidebar-link" data-panel="projects"><span class="sl-icon">⚙️</span> Projects<span class="sl-count" id="cnt-projects">0</span></button>
  </nav>
  <div class="sidebar-footer">
    <a href="index.html" target="_blank">← View Portfolio</a>
    <a href="#" id="exportBtn">Export Data (JSON)</a>
    <a href="#" id="resetBtn" style="color:rgba(220,80,80,.5);">Reset to Defaults</a>
  </div>
</aside>

<div class="main">
  <div class="topbar">
    <div class="topbar-title" id="topbar-title">Dashboard <em>Overview</em></div>
    <div class="topbar-actions">
      <button class="btn btn-primary" id="addBtn" style="display:none">+ Add New</button>
    </div>
  </div>
  <div class="content" id="content-area">
    <div style="display:flex;align-items:center;justify-content:center;padding:5rem;color:var(--text-dim);">Loading...</div>
  </div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="modal-title">Add Item</div>
      <button class="modal-close" id="modal-close">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-footer">
      <button class="btn" id="modal-cancel">Cancel</button>
      <button class="btn btn-primary" id="modal-save">Save</button>
    </div>
  </div>
</div>

<!-- CONFIRM -->
<div class="confirm-dialog" id="confirmDialog">
  <div class="confirm-box">
    <div class="confirm-icon">🗑</div>
    <div class="confirm-title">Delete this item?</div>
    <div class="confirm-text">This cannot be undone. The item will be permanently removed from your portfolio.</div>
    <div class="confirm-actions">
      <button class="btn" id="confirmNo">Cancel</button>
      <button class="btn btn-danger" id="confirmYes">Delete</button>
    </div>
  </div>
</div>

<script src="db.js"></script>
<script>
// ── STATE ──
let currentPanel = 'dashboard';
let editingId = null;
let deleteCallback = null;
let allData = {};

// Temp in-memory for dynamic lists (images, pdfs, extraLinks)
let tempImages = [];
let tempPdfs = [];
let tempExtraLinks = [];
let tempVideoLinks = [];

const PANELS = {
  dashboard:    { title: 'Dashboard <em>Overview</em>',           hasAdd: false },
  design:       { title: 'Design <em>Posts</em>',                 hasAdd: true,  addLabel: 'Add Design Post' },
  video:        { title: 'Video <em>Works</em>',                  hasAdd: true,  addLabel: 'Add Video' },
  violin:       { title: 'Violin <em>Performances</em>',          hasAdd: true,  addLabel: 'Add Performance' },
  competitions: { title: 'Competitions &amp; <em>Initiatives</em>',hasAdd: true,  addLabel: 'Add Competition' },
  blog:         { title: 'Blog <em>Posts</em>',                   hasAdd: true,  addLabel: 'New Blog Post' },
  projects:     { title: 'Software <em>Projects</em>',            hasAdd: true,  addLabel: 'Add Project' },
};

// ── TOAST ──
function toast(msg, type='info') {
  const el = document.createElement('div');
  const bg = {info:'rgba(100,160,255,.88)',success:'rgba(56,200,130,.88)',error:'rgba(220,80,80,.88)'};
  el.className = 'toast';
  el.style.cssText = `background:${bg[type]||bg.info};color:#fff;`;
  el.textContent = msg;
  el.style.opacity = '0'; el.style.transform = 'translateY(8px)';
  document.body.appendChild(el);
  setTimeout(()=>{el.style.opacity='1';el.style.transform='translateY(0)';},10);
  setTimeout(()=>{el.style.opacity='0';setTimeout(()=>el.remove(),300);},2800);
}

// ── CONFIRM ──
function confirm(cb) {
  deleteCallback = cb;
  document.getElementById('confirmDialog').classList.add('open');
}
document.getElementById('confirmNo').onclick = () => { document.getElementById('confirmDialog').classList.remove('open'); deleteCallback = null; };
document.getElementById('confirmYes').onclick = () => {
  document.getElementById('confirmDialog').classList.remove('open');
  if (deleteCallback) { deleteCallback(); deleteCallback = null; }
};

// ── MODAL ──
const modal = document.getElementById('modal');
function openModal(title, bodyHTML, onSave) {
  document.getElementById('modal-title').innerHTML = title;
  document.getElementById('modal-body').innerHTML = bodyHTML;
  modal.classList.add('open');
  document.getElementById('modal-save').onclick = onSave;
  // Wire file inputs for image previews
  modal.querySelectorAll('input[type=file][data-preview]').forEach(inp => {
    inp.addEventListener('change', function() {
      const previewId = this.dataset.preview;
      if (this.files[0]) {
        const reader = new FileReader();
        reader.onload = e => {
          const prev = document.getElementById(previewId);
          if (prev) { prev.src = e.target.result; prev.style.display = 'block'; }
          // Also update hidden url field if exists
          const urlField = document.getElementById(this.dataset.urlfield);
          if (urlField) urlField.value = e.target.result;
        };
        reader.readAsDataURL(this.files[0]);
      }
    });
  });
}
function closeModal() {
  modal.classList.remove('open');
  editingId = null;
  tempImages = []; tempPdfs = []; tempExtraLinks = []; tempVideoLinks = [];
}
document.getElementById('modal-close').onclick = closeModal;
document.getElementById('modal-cancel').onclick = closeModal;
modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });

// ── RENDER PANEL ──

function renderImageList(listId, items) {
  const el = document.getElementById(listId);
  if (!el) return;
  if (!items.length) { el.innerHTML = '<div style="font-size:.7rem;color:var(--text-dim);padding:.4rem 0;">No images added yet.</div>'; return; }
  el.innerHTML = items.map((img, idx) => {
    const url = typeof img === 'string' ? img : img.url;
    const label = typeof img === 'string' ? 'Image '+(idx+1) : (img.label||'Image '+(idx+1));
    return `<div class="img-gallery-thumb">
      <img src="${url}" alt="${label}">
      <button class="img-remove" onclick="removeImage(${idx},'${listId}')" title="Remove">✕</button>
    </div>`;
  }).join('');
}

function removeImage(idx, listId) {
  tempImages.splice(idx, 1);
  renderImageList(listId, tempImages);
}

function addImageFromUrl(urlInputId, listId) {
  const urlEl = document.getElementById(urlInputId);
  const url = urlEl.value.trim();
  if (!url) { toast('Enter an image URL first', 'error'); return; }
  tempImages.push({ url, label: 'Screenshot' });
  urlEl.value = '';
  renderImageList(listId, tempImages);
  toast('Image added', 'success');
}

function addImageFromUpload(fileInputId, listId) {
  const inp = document.getElementById(fileInputId);
  const file = inp.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    tempImages.push({ url: e.target.result, label: file.name });
    inp.value = '';
    renderImageList(listId, tempImages);
    toast('Image uploaded', 'success');
  };
  reader.readAsDataURL(file);
}

// ── OPEN FORM ──
async function openForm(collection, id) {
  editingId = id;
  let item = id ? await DB[collection].get(id) : null;
  const isEdit = !!item;

  // Reset temp state
  tempImages = item?.images ? JSON.parse(JSON.stringify(item.images)) : [];
  tempPdfs = item?.pdfs ? JSON.parse(JSON.stringify(item.pdfs)) : [];
  tempExtraLinks = item?.extraLinks ? JSON.parse(JSON.stringify(item.extraLinks)) : [];
  tempVideoLinks = item?.links ? JSON.parse(JSON.stringify(item.links)) : [];

  const title = isEdit ? `Edit <em>${collection}</em>` : `Add <em>${PANELS[collection]?.addLabel?.replace('Add ','')}</em>`;
  const forms = { design: formDesign, video: formVideo, violin: formViolin, competitions: formCompetition, blog: formBlog, projects: formProject };
  const bodyHTML = forms[collection] ? forms[collection](item) : '<p>Form not available</p>';

  openModal(title, bodyHTML, async () => {
    const data = collectForm(collection);
    if (!data) return;
    if (isEdit) { await DB[collection].update(id, data); toast('Updated!', 'success'); }
    else { await DB[collection].add(data); toast('Added!', 'success'); }
    closeModal();
    renderPanel(collection);
    loadCounts();
  });

  // Init dynamic lists after DOM inserted
  setTimeout(() => {
    if (collection === 'projects') {
      renderImageList('img-gallery', tempImages);
      renderPdfList();
      renderExtraLinks();
    }
    if (collection === 'video') renderVideoLinks();
  }, 50);
}

// ── COLLECT FORM ──
function collectForm(collection) {
  const gv = id => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };
  const gb = id => { const el = document.getElementById(id); return el ? el.checked : false; };

  const maps = {
    design: () => ({
      title: gv('f_title'), category: gv('f_category'), date: gv('f_date'),
      description: gv('f_description'),
      tags: gv('f_tags').split(',').map(t=>t.trim()).filter(Boolean),
      image: gv('f_image'), featured: gb('f_featured')
    }),
    video: () => ({
      title: gv('f_title'), category: gv('f_category'), duration: gv('f_duration'),
      embedUrl: gv('f_embedUrl'), thumbnail: gv('f_thumbnail'), description: gv('f_description'),
      date: gv('f_date'), featured: gb('f_featured'),
      tags: gv('f_tags').split(',').map(t=>t.trim()).filter(Boolean),
      links: [...tempVideoLinks]
    }),
    violin: () => ({
      title: gv('f_title'), composer: gv('f_composer'), type: gv('f_type'),
      description: gv('f_description'), mediaUrl: gv('f_mediaUrl'),
      date: gv('f_date'), featured: gb('f_featured')
    }),
    competitions: () => ({
      title: gv('f_title'), icon: gv('f_icon')||'🏆', year: gv('f_year'),
      scope: gv('f_scope'), outcome: gv('f_outcome'),
      description: gv('f_description'), learned: gv('f_learned')
    }),
    blog: () => ({
      title: gv('f_title'), category: gv('f_category'), date: gv('f_date'),
      excerpt: gv('f_excerpt'), content: gv('f_content'),
      tags: gv('f_tags').split(',').map(t=>t.trim()).filter(Boolean),
      featured: gb('f_featured')
    }),
    projects: () => ({
      title: gv('f_title'), subtitle: gv('f_subtitle'), icon: gv('f_icon')||'⚙️',
      status: gv('f_status'), statusLabel: gv('f_statusLabel'), date: gv('f_date'),
      description: gv('f_description'),
      techStack: gv('f_techStack').split(',').map(t=>t.trim()).filter(Boolean),
      features: gv('f_features').split('\n').map(t=>t.trim()).filter(Boolean),
      links: { github: gv('f_github'), live: gv('f_live'), demo: gv('f_demo') },
      images: [...tempImages],
      pdfs: [...tempPdfs],
      extraLinks: [...tempExtraLinks],
      featured: gb('f_featured')
    }),
  };

  const fn = maps[collection];
  if (!fn) return null;
  const data = fn();
  if (!data.title) { toast('Title is required', 'error'); return null; }
  return data;
}

// ── HELPERS ──
function esc(str) { return String(str).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function wrapSelection(id, open, close) {
  const ta = document.getElementById(id);
  if (!ta) return;
  const start = ta.selectionStart, end = ta.selectionEnd;
  const selected = ta.value.substring(start, end);
  ta.value = ta.value.substring(0,start) + open + selected + close + ta.value.substring(end);
  ta.focus();
}

// ── EXPORT ──
document.getElementById('exportBtn').onclick = async (e) => {
  e.preventDefault();
  const data = await DB.exportAll();
  const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = 'bavly-portfolio-data.json'; a.click();
  URL.revokeObjectURL(url);
  toast('Data exported!', 'success');
};

// ── RESET ──
document.getElementById('resetBtn').onclick = async (e) => {
  e.preventDefault();
  confirm(async () => {
    await DB.resetAll();
    toast('Reset to default data', 'info');
    loadCounts();
    renderPanel(currentPanel);
  });
};
