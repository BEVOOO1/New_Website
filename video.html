<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video — Bavly Badr</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=Tenor+Sans&family=Cinzel:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
.hero-orb-v{width:650px;height:650px;background:radial-gradient(circle,rgba(56,200,130,.08) 0%,transparent 70%);top:-120px;left:-120px;animation:vd 16s ease-in-out infinite alternate;}
@keyframes vd{from{transform:translate(0,0);}to{transform:translate(30px,22px);}}

.video-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.4rem;}
.video-card{border-radius:var(--radius-md);overflow:hidden;background:var(--glass-deep);border:1px solid var(--border);transition:all .45s cubic-bezier(.23,1,.32,1);cursor:pointer;}
.video-card:hover{border-color:var(--border-gold);transform:translateY(-6px);box-shadow:0 28px 80px rgba(0,0,0,.55);}
.video-card.featured{grid-column:1/-1;display:grid;grid-template-columns:1.6fr 1fr;}

.vc-thumb{position:relative;aspect-ratio:16/9;background:linear-gradient(135deg,#0a0c16,#141828);overflow:hidden;}
.video-card.featured .vc-thumb{aspect-ratio:unset;min-height:280px;}
.vc-thumb img{width:100%;height:100%;object-fit:cover;transition:transform .5s;display:block;}
.video-card:hover .vc-thumb img{transform:scale(1.04);}

.vc-play-overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.8rem;background:rgba(7,8,15,.35);transition:background .3s;}
.video-card:hover .vc-play-overlay{background:rgba(7,8,15,.6);}
.vc-play-btn{width:64px;height:64px;border-radius:50%;background:rgba(212,175,120,.15);border:2px solid rgba(212,175,120,.4);display:flex;align-items:center;justify-content:center;font-size:1.4rem;backdrop-filter:blur(12px);transition:all .3s;color:var(--gold);}
.video-card:hover .vc-play-btn{background:rgba(212,175,120,.3);border-color:var(--gold);transform:scale(1.12);box-shadow:0 0 40px rgba(212,175,120,.3);}
.vc-play-label{font-family:'Tenor Sans',sans-serif;font-size:.6rem;letter-spacing:.18em;text-transform:uppercase;color:rgba(212,175,120,.75);}
.vc-duration{position:absolute;bottom:.75rem;right:.75rem;background:rgba(7,8,15,.85);backdrop-filter:blur(8px);font-size:.62rem;letter-spacing:.05em;color:var(--text-muted);padding:.2rem .55rem;border-radius:4px;}
.vc-ph{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.6rem;width:100%;height:100%;padding:2rem;}
.vc-ph-icon{font-size:2.2rem;opacity:.18;}
.vc-ph-text{font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;color:var(--text-dim);text-align:center;}

.vc-info{padding:1.4rem 1.6rem;}
.video-card.featured .vc-info{padding:2.2rem 2rem;display:flex;flex-direction:column;justify-content:center;}
.vc-cat{font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-bottom:.5rem;display:flex;align-items:center;gap:.5rem;}
.vc-cat::before{content:'';width:14px;height:1px;background:var(--gold);}
.vc-title{font-family:'Playfair Display',serif;font-size:1rem;font-weight:400;line-height:1.35;color:var(--text);margin-bottom:.5rem;}
.video-card.featured .vc-title{font-size:1.55rem;}
.vc-desc{font-family:'Tenor Sans',sans-serif;font-size:.76rem;line-height:1.8;color:var(--text-dim);margin-bottom:.8rem;}
.vc-tags{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:.6rem;}
.vc-cta{display:inline-flex;align-items:center;gap:.5rem;font-family:'Tenor Sans',sans-serif;font-size:.67rem;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);border:1px solid var(--border-gold);padding:.4rem 1rem;border-radius:6px;margin-top:.2rem;transition:all .25s;background:rgba(212,175,120,.04);}
.vc-cta:hover{background:rgba(212,175,120,.1);}

/* ── VIDEO MODAL ── */
.vm-overlay{position:fixed;inset:0;z-index:800;background:rgba(4,5,12,.97);backdrop-filter:blur(28px);display:none;flex-direction:column;align-items:center;justify-content:center;padding:2rem;}
.vm-overlay.open{display:flex;}
.vm-close{position:fixed;top:1.5rem;right:1.5rem;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.08);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-muted);font-size:1.1rem;transition:all .2s;z-index:10;}
.vm-close:hover{background:rgba(255,255,255,.15);color:var(--text);}
.vm-frame-wrap{position:relative;width:100%;max-width:920px;border-radius:14px;overflow:hidden;box-shadow:0 40px 120px rgba(0,0,0,.8);border:1px solid rgba(212,175,120,.15);background:#000;}
.vm-frame-wrap::after{content:'';display:block;padding-bottom:56.25%;}
.vm-frame-wrap iframe{position:absolute;inset:0;width:100%;height:100%;border:none;}
.vm-info{max-width:920px;width:100%;margin-top:1.4rem;display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;flex-wrap:wrap;}
.vm-title{font-family:'Playfair Display',serif;font-size:1.25rem;font-weight:400;color:var(--text);}
.vm-sub{font-size:.7rem;letter-spacing:.08em;color:var(--text-dim);margin-top:.25rem;}
.vm-ext-links{display:flex;gap:.5rem;flex-wrap:wrap;}

/* no-embed links panel */
.vm-links-panel{max-width:460px;width:100%;background:var(--glass);border:1px solid var(--border-gold);border-radius:18px;padding:2.5rem;text-align:center;}
.vm-lp-icon{font-size:2.5rem;margin-bottom:1rem;opacity:.35;}
.vm-lp-title{font-family:'Playfair Display',serif;font-size:1.3rem;color:var(--text);margin-bottom:.4rem;}
.vm-lp-sub{font-size:.78rem;color:var(--text-dim);margin-bottom:1.8rem;line-height:1.7;}
.vm-lp-links{display:flex;flex-direction:column;gap:.6rem;}
.vm-lp-link{display:flex;align-items:center;justify-content:center;gap:.6rem;padding:.85rem 1.5rem;border-radius:10px;border:1px solid var(--border-gold);color:var(--gold);font-family:'Tenor Sans',sans-serif;font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;text-decoration:none;transition:all .25s;background:rgba(212,175,120,.04);}
.vm-lp-link:hover{background:rgba(212,175,120,.12);box-shadow:0 6px 24px rgba(212,175,120,.2);}

@media(max-width:900px){
  .video-grid{grid-template-columns:1fr;}
  .video-card.featured{grid-template-columns:1fr;}
  .video-card.featured .vc-thumb{min-height:220px;}
}
</style>
</head>
<body>

</div></nav>

<section class="page-hero">
  <div class="page-hero-bg"><div class="page-hero-orb hero-orb-v"></div></div>
  <div class="wrapper">
    <div class="section-label" style="animation:fadeUp .6s ease both;">Motion & Film</div>
    <h1 class="section-title" style="font-size:clamp(3rem,6vw,5rem);animation:fadeUp .7s .1s ease both;">Video<br><em>Editing</em></h1>
    <p style="font-size:.88rem;line-height:1.9;color:var(--text-dim);max-width:480px;margin-top:1.5rem;animation:fadeUp .7s .2s ease both;">Cinematic storytelling through the edit. Church events, recaps, and creative short-form content.</p>

    <a href="https://github.com/BEVOOO1" target="_blank">GitHub</a>

  </div>
</div></footer>

<!-- VIDEO MODAL -->
<div class="vm-overlay" id="vmOverlay">
  <button class="vm-close" id="vmClose">✕</button>
  <div id="vmContent"></div>
</div>

<script src="db.js"></script>
<script src="shared.js"></script>
<script>
'use strict';
let _items = [];
const vmOverlay = document.getElementById('vmOverlay');
const vmContent = document.getElementById('vmContent');

function closeVideoModal() {
  vmOverlay.classList.remove('open');
  vmContent.innerHTML = ''; // stop playback
}
document.getElementById('vmClose').onclick = closeVideoModal;
vmOverlay.addEventListener('click', e => { if (e.target === vmOverlay) closeVideoModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeVideoModal(); });

function openVideoModal(idx) {
  const v = _items[idx];
  if (!v) return;
  if (v.embedUrl) {
    const extLinks = (v.links||[]).map(l =>
      `<a class="media-link" href="${escAttr(safeUrl(l.url))}" target="_blank" rel="noopener">${sanitizeHTML(l.label||'Watch')}</a>`
    ).join('');
    vmContent.innerHTML = `
      <div class="vm-frame-wrap">
        <iframe src="${escAttr(v.embedUrl)}" allowfullscreen allow="autoplay; encrypted-media"></iframe>
      </div>
      <div class="vm-info">
        <div>
          <div class="vm-title">${sanitizeHTML(v.title)}</div>
          <div class="vm-sub">${sanitizeHTML(v.category||'')}${v.duration?' · '+sanitizeHTML(v.duration):''}${v.date?' · '+sanitizeHTML(v.date):''}</div>
        </div>
        ${extLinks?`<div class="vm-ext-links">${extLinks}</div>`:''}
      </div>`;
  } else {
    const links = (v.links||[]);
    const linksHTML = links.length
      ? links.map(l=>`<a class="vm-lp-link" href="${escAttr(safeUrl(l.url))}" target="_blank" rel="noopener">▶ ${sanitizeHTML(l.label||'Watch')}</a>`).join('')
      : `<p style="color:var(--text-dim);font-size:.78rem;">No links added yet — add them in the Admin panel.</p>`;
    vmContent.innerHTML = `
      <div class="vm-links-panel">
        <div class="vm-lp-icon">🎬</div>
        <div class="vm-lp-title">${sanitizeHTML(v.title)}</div>
        <div class="vm-lp-sub">${sanitizeHTML(v.description||'')}</div>
        <div class="vm-lp-links">${linksHTML}</div>
      </div>`;
  }
  vmOverlay.classList.add('open');
}

async function init() {
  _items = await DB.video.getAll();
  const el = document.getElementById('video-grid');
  if (!_items.length) {
    el.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:4rem;color:var(--text-dim);">
      <div style="font-size:2rem;margin-bottom:.8rem;opacity:.3;">🎬</div>
      <div style="font-size:.82rem;">No videos yet. <a href="admin.html" style="color:var(--gold);">Add some in Admin →</a></div>
    </div>`; return;
  }
  el.innerHTML = _items.map((v,i) => {
    const isFirst = i===0;
    const tags = (v.tags||[]).map(t=>`<span class="tag-pill">${sanitizeHTML(t)}</span>`).join('');
    const thumbInner = v.thumbnail
      ? `<img src="${escAttr(v.thumbnail)}" alt="${escAttr(v.title)}">`
      : `<div class="vc-ph"><div class="vc-ph-icon">🎬</div><div class="vc-ph-text">Click to view</div></div>`;
    return `<div class="video-card${isFirst?' featured':''}" onclick="openVideoModal(${i})">
      <div class="vc-thumb">
        ${thumbInner}
        <div class="vc-play-overlay">
          <div class="vc-play-btn">▶</div>
          <div class="vc-play-label">Watch Now</div>
        </div>
        ${v.duration?`<div class="vc-duration">${escAttr(v.duration)}</div>`:''}
      </div>
      <div class="vc-info">
        <div class="vc-cat">${sanitizeHTML(v.category||'Video')}</div>
        <div class="vc-title">${sanitizeHTML(v.title)}</div>
        ${v.description?`<div class="vc-desc">${sanitizeHTML(v.description)}</div>`:''}
        ${tags?`<div class="vc-tags">${tags}</div>`:''}
        <span class="vc-cta">▶ ${v.embedUrl?'Watch Embed':'View Links'}</span>
      </div>
    </div>`;
  }).join('');
}
init();
</script>
</body>
