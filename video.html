<meta charset="UTF-8">

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=Tenor+Sans&family=Cinzel:wght@400;600&display=swap" rel="stylesheet">

<style>
/* ── HERO ── */
.hero-orb-v{width:700px;height:700px;background:radial-gradient(circle,rgba(56,200,130,.07) 0%,transparent 70%);top:-160px;left:-200px;animation:vd 18s ease-in-out infinite alternate;}
.hero-orb-v2{width:400px;height:400px;background:radial-gradient(circle,rgba(212,175,120,.06) 0%,transparent 70%);bottom:0;right:5%;animation:vd2 12s ease-in-out infinite alternate;}
@keyframes vd{from{transform:translate(0,0);}to{transform:translate(35px,25px);}}
@keyframes vd2{from{transform:translate(0,0);}to{transform:translate(-20px,15px);}}

/* ════════════════════════════════
   FEATURED PLAYER — top of page
════════════════════════════════ */
.featured-player{position:relative;width:100%;max-width:1100px;margin:0 auto 5rem;z-index:2;}

/* Thumbnail / embed state */
.fp-stage{position:relative;border-radius:20px;overflow:hidden;background:#000;box-shadow:0 40px 120px rgba(0,0,0,.8);border:1px solid rgba(212,175,120,.18);}
.fp-stage::after{content:'';display:block;padding-bottom:56.25%;}
.fp-stage iframe,.fp-stage .fp-thumb-cover{position:absolute;inset:0;width:100%;height:100%;border:none;}
.fp-thumb-cover{object-fit:cover;display:block;transition:transform .6s cubic-bezier(.23,1,.32,1);}
.fp-stage:hover .fp-thumb-cover{transform:scale(1.02);}

/* Play overlay on thumbnail */
.fp-play-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(7,8,15,.3);transition:background .35s;cursor:pointer;z-index:3;}
.fp-play-overlay:hover{background:rgba(7,8,15,.55);}
.fp-play-btn{width:90px;height:90px;border-radius:50%;background:rgba(212,175,120,.15);border:2px solid rgba(212,175,120,.55);display:flex;align-items:center;justify-content:center;backdrop-filter:blur(16px);transition:all .4s cubic-bezier(.23,1,.32,1);}
.fp-play-btn svg{width:32px;height:32px;fill:var(--gold);margin-left:5px;transition:transform .3s;}
.fp-play-overlay:hover .fp-play-btn{background:rgba(212,175,120,.28);border-color:var(--gold);transform:scale(1.08);box-shadow:0 0 60px rgba(212,175,120,.35);}
.fp-play-overlay:hover .fp-play-btn svg{transform:scale(1.1);}

/* No thumbnail placeholder */
.fp-no-thumb{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.2rem;background:linear-gradient(135deg,#0a0c18 0%,#0e1220 100%);}
.fp-no-thumb-icon{font-size:3.5rem;opacity:.15;}
.fp-no-thumb-text{font-family:'Tenor Sans',sans-serif;font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:var(--text-dim);}

/* Info bar below featured player */
.fp-info{display:grid;grid-template-columns:1fr auto;gap:2rem;align-items:start;margin-top:2rem;padding:0 .5rem;}
.fp-info-left .fp-eyebrow{font-family:'Tenor Sans',sans-serif;font-size:.62rem;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin-bottom:.6rem;display:flex;align-items:center;gap:.6rem;}
.fp-info-left .fp-eyebrow::before{content:'';width:20px;height:1px;background:var(--gold);}
.fp-title{font-family:'Playfair Display',serif;font-size:clamp(1.5rem,3vw,2.2rem);font-weight:400;color:var(--text);line-height:1.15;margin-bottom:.6rem;}
.fp-meta{display:flex;align-items:center;gap:1.2rem;flex-wrap:wrap;margin-bottom:1rem;}
.fp-meta-item{font-family:'Tenor Sans',sans-serif;font-size:.72rem;letter-spacing:.06em;color:var(--text-dim);display:flex;align-items:center;gap:.4rem;}
.fp-meta-item::before{content:'';width:4px;height:4px;border-radius:50%;background:rgba(212,175,120,.4);}
.fp-meta-item:first-child::before{display:none;}
.fp-desc{font-family:'Tenor Sans',sans-serif;font-size:.84rem;line-height:1.85;color:var(--text-muted);max-width:620px;}
.fp-tags{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:1rem;}

/* Action buttons */
.fp-actions{display:flex;flex-direction:column;gap:.7rem;min-width:180px;}
.fp-action-btn{display:flex;align-items:center;justify-content:center;gap:.6rem;padding:.85rem 1.4rem;border-radius:12px;font-family:'Tenor Sans',sans-serif;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;text-decoration:none;transition:all .3s;cursor:pointer;border:none;}
.fp-action-primary{background:linear-gradient(135deg,rgba(212,175,120,.22),rgba(212,175,120,.1));border:1px solid var(--border-gold);color:var(--gold);}
.fp-action-primary:hover{background:linear-gradient(135deg,rgba(212,175,120,.35),rgba(212,175,120,.18));box-shadow:0 8px 32px rgba(212,175,120,.2);}
.fp-action-secondary{background:rgba(255,255,255,.04);border:1px solid var(--border);color:var(--text-muted);}
.fp-action-secondary:hover{background:rgba(255,255,255,.08);color:var(--text);border-color:rgba(255,255,255,.15);}

/* No embed — links shown inline */
.fp-ext-links{display:flex;flex-direction:column;gap:.6rem;width:100%;max-width:200px;}
.fp-ext-link{display:flex;align-items:center;justify-content:center;gap:.6rem;padding:.8rem 1.2rem;border-radius:10px;border:1px solid var(--border-gold);color:var(--gold);font-family:'Tenor Sans',sans-serif;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;text-decoration:none;transition:all .3s;background:rgba(212,175,120,.05);}
.fp-ext-link:hover{background:rgba(212,175,120,.14);box-shadow:0 6px 24px rgba(212,175,120,.2);}

/* ════════════════════════════════
   VIDEO GRID — all other videos
════════════════════════════════ */
.section-eyebrow{display:flex;align-items:center;gap:1rem;margin-bottom:2rem;}
.section-eyebrow::after{content:'';flex:1;height:1px;background:linear-gradient(to right,var(--border-gold),transparent);}
.section-eyebrow-text{font-family:'Tenor Sans',sans-serif;font-size:.65rem;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);white-space:nowrap;}

.video-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.4rem;}

/* ── CARD ── */
.vc{border-radius:16px;overflow:hidden;background:var(--glass-deep);border:1px solid var(--border);transition:all .45s cubic-bezier(.23,1,.32,1);cursor:pointer;display:flex;flex-direction:column;}
.vc:hover{border-color:var(--border-gold);transform:translateY(-8px);box-shadow:0 32px 80px rgba(0,0,0,.6);}

/* Thumbnail */
.vc-thumb{position:relative;aspect-ratio:16/9;background:#080a12;overflow:hidden;flex-shrink:0;}
.vc-thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .55s cubic-bezier(.23,1,.32,1);}
.vc:hover .vc-thumb img{transform:scale(1.06);}

/* Cinematic gradient at bottom of thumb */
.vc-thumb-gradient{position:absolute;inset:0;background:linear-gradient(to top,rgba(7,8,15,.75) 0%,rgba(7,8,15,.1) 50%,transparent 100%);pointer-events:none;}

/* Play ring */
.vc-play-ring{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .35s;}
.vc:hover .vc-play-ring{opacity:1;}
.vc-play-circle{width:56px;height:56px;border-radius:50%;background:rgba(212,175,120,.18);border:2px solid rgba(212,175,120,.55);display:flex;align-items:center;justify-content:center;backdrop-filter:blur(12px);transition:all .3s;}
.vc:hover .vc-play-circle{transform:scale(1.1);box-shadow:0 0 40px rgba(212,175,120,.3);}
.vc-play-circle svg{width:18px;height:18px;fill:var(--gold);margin-left:3px;}

/* Duration badge */
.vc-duration{position:absolute;bottom:.65rem;right:.7rem;background:rgba(7,8,15,.88);backdrop-filter:blur(8px);font-family:'Tenor Sans',sans-serif;font-size:.58rem;letter-spacing:.06em;color:var(--text-muted);padding:.2rem .55rem;border-radius:4px;}

/* Category badge */
.vc-cat-badge{position:absolute;top:.7rem;left:.7rem;background:rgba(7,8,15,.7);backdrop-filter:blur(8px);border:1px solid rgba(212,175,120,.25);font-family:'Tenor Sans',sans-serif;font-size:.55rem;letter-spacing:.15em;text-transform:uppercase;color:var(--gold);padding:.2rem .6rem;border-radius:4px;}

/* No thumbnail placeholder */
.vc-ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.6rem;background:linear-gradient(135deg,#0a0c16,#0e1220);}
.vc-ph-icon{font-size:2rem;opacity:.14;}
.vc-ph-text{font-family:'Tenor Sans',sans-serif;font-size:.58rem;letter-spacing:.12em;text-transform:uppercase;color:var(--text-dim);}

/* Card info */
.vc-info{padding:1.3rem 1.5rem 1.5rem;display:flex;flex-direction:column;flex:1;}
.vc-title{font-family:'Playfair Display',serif;font-size:1rem;font-weight:400;line-height:1.3;color:var(--text);margin-bottom:.45rem;}
.vc-desc{font-family:'Tenor Sans',sans-serif;font-size:.74rem;line-height:1.75;color:var(--text-dim);margin-bottom:.8rem;flex:1;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.vc-tags{display:flex;gap:.35rem;flex-wrap:wrap;margin-bottom:.8rem;}
.vc-footer{display:flex;align-items:center;justify-content:space-between;margin-top:auto;}
.vc-date{font-family:'Tenor Sans',sans-serif;font-size:.62rem;letter-spacing:.05em;color:var(--text-dim);}
.vc-watch{font-family:'Tenor Sans',sans-serif;font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);display:flex;align-items:center;gap:.4rem;opacity:.7;transition:opacity .2s;}
.vc:hover .vc-watch{opacity:1;}

/* ════════════════════════════════
   FULL-SCREEN VIDEO DRAWER
   (slides in from right)
════════════════════════════════ */
.vd-backdrop{position:fixed;inset:0;z-index:700;background:rgba(4,5,12,.7);backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .4s;}
.vd-backdrop.open{opacity:1;pointer-events:all;}

.vd-drawer{position:fixed;top:0;right:0;bottom:0;z-index:701;width:min(620px,100vw);background:linear-gradient(180deg,rgba(10,12,20,.98) 0%,rgba(7,8,15,.99) 100%);border-left:1px solid rgba(212,175,120,.15);box-shadow:-40px 0 100px rgba(0,0,0,.8);transform:translateX(100%);transition:transform .5s cubic-bezier(.23,1,.32,1);display:flex;flex-direction:column;overflow:hidden;}
.vd-drawer.open{transform:translateX(0);}

/* Drawer header / player */
.vd-player{position:relative;width:100%;flex-shrink:0;}
.vd-player::after{content:'';display:block;padding-bottom:56.25%;}
.vd-player iframe{position:absolute;inset:0;width:100%;height:100%;border:none;}
.vd-player-thumb{position:absolute;inset:0;overflow:hidden;}
.vd-player-thumb img{width:100%;height:100%;object-fit:cover;}
.vd-player-no-embed{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;background:linear-gradient(135deg,#090b16,#0e1225);}
.vd-player-no-embed-icon{font-size:3rem;opacity:.12;}
.vd-player-no-embed-text{font-family:'Tenor Sans',sans-serif;font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;color:var(--text-dim);}

/* Gradient overlay on thumb in drawer */
.vd-thumb-overlay{position:absolute;inset:0;background:linear-gradient(to bottom,transparent 40%,rgba(10,12,20,1) 100%);pointer-events:none;}

/* Play button in drawer thumb */
.vd-thumb-play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:2;}
.vd-thumb-play-btn{width:72px;height:72px;border-radius:50%;background:rgba(212,175,120,.16);border:2px solid rgba(212,175,120,.5);display:flex;align-items:center;justify-content:center;backdrop-filter:blur(14px);transition:all .35s;}
.vd-thumb-play-btn svg{width:26px;height:26px;fill:var(--gold);margin-left:4px;}
.vd-thumb-play:hover .vd-thumb-play-btn{background:rgba(212,175,120,.3);border-color:var(--gold);transform:scale(1.1);box-shadow:0 0 50px rgba(212,175,120,.3);}

/* Drawer close */
.vd-close{position:absolute;top:1rem;left:1rem;z-index:10;width:40px;height:40px;border-radius:50%;background:rgba(7,8,15,.7);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-muted);font-size:1rem;transition:all .2s;}
.vd-close:hover{background:rgba(255,255,255,.1);color:var(--text);}

/* Drawer scroll body */
.vd-body{flex:1;overflow-y:auto;padding:1.8rem 2rem 3rem;scrollbar-width:thin;scrollbar-color:rgba(212,175,120,.2) transparent;}
.vd-body::-webkit-scrollbar{width:4px;}
.vd-body::-webkit-scrollbar-thumb{background:rgba(212,175,120,.2);border-radius:10px;}

/* Eyebrow */
.vd-eyebrow{font-family:'Tenor Sans',sans-serif;font-size:.6rem;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin-bottom:.7rem;display:flex;align-items:center;gap:.5rem;}
.vd-eyebrow::before{content:'';width:16px;height:1px;background:var(--gold);}

/* Title */
.vd-title{font-family:'Playfair Display',serif;font-size:1.65rem;font-weight:400;color:var(--text);line-height:1.15;margin-bottom:.8rem;}

/* Meta row */
.vd-meta-row{display:flex;align-items:center;gap:0;flex-wrap:wrap;margin-bottom:1.4rem;}
.vd-meta-chip{font-family:'Tenor Sans',sans-serif;font-size:.68rem;letter-spacing:.06em;color:var(--text-dim);padding:.15rem .6rem;}
.vd-meta-chip+.vd-meta-chip::before{content:'·';margin-right:.6rem;color:rgba(212,175,120,.3);}
.vd-meta-chip:first-child{padding-left:0;}

/* Description */
.vd-desc-label{font-family:'Tenor Sans',sans-serif;font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;color:rgba(212,175,120,.5);margin-bottom:.5rem;}
.vd-desc{font-family:'Tenor Sans',sans-serif;font-size:.84rem;line-height:1.9;color:var(--text-muted);margin-bottom:1.6rem;}

/* Divider */
.vd-hr{height:1px;background:linear-gradient(to right,rgba(212,175,120,.2),transparent);margin:1.4rem 0;}

/* Tags */
.vd-tags-row{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:1.6rem;}

/* Links section */
.vd-links-label{font-family:'Tenor Sans',sans-serif;font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;color:rgba(212,175,120,.5);margin-bottom:.8rem;}
.vd-links{display:flex;flex-direction:column;gap:.55rem;}
.vd-link{display:flex;align-items:center;gap:1rem;padding:1rem 1.3rem;border-radius:12px;border:1px solid rgba(212,175,120,.2);background:rgba(212,175,120,.04);text-decoration:none;transition:all .3s;color:var(--text);}
.vd-link:hover{border-color:var(--border-gold);background:rgba(212,175,120,.1);transform:translateX(4px);}
.vd-link-icon{width:36px;height:36px;border-radius:8px;background:rgba(212,175,120,.1);display:flex;align-items:center;justify-content:center;font-size:1rem;flex-shrink:0;}
.vd-link-text{flex:1;}
.vd-link-label{font-family:'Playfair Display',serif;font-size:.88rem;color:var(--text);margin-bottom:.1rem;}
.vd-link-url{font-family:'Tenor Sans',sans-serif;font-size:.65rem;color:var(--text-dim);letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px;}
.vd-link-arrow{color:var(--gold);font-size:.9rem;opacity:0;transition:opacity .2s,transform .2s;}
.vd-link:hover .vd-link-arrow{opacity:1;transform:translateX(3px);}

/* Open in embed button inside drawer */
.vd-embed-btn{display:flex;align-items:center;justify-content:center;gap:.7rem;width:100%;padding:1rem;border-radius:12px;background:linear-gradient(135deg,rgba(212,175,120,.18),rgba(212,175,120,.08));border:1px solid var(--border-gold);color:var(--gold);font-family:'Tenor Sans',sans-serif;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;transition:all .3s;margin-bottom:1.2rem;}
.vd-embed-btn:hover{background:linear-gradient(135deg,rgba(212,175,120,.3),rgba(212,175,120,.15));box-shadow:0 8px 32px rgba(212,175,120,.2);}

/* No links message */
.vd-no-links{padding:1.5rem;border:1px dashed rgba(212,175,120,.15);border-radius:12px;text-align:center;color:var(--text-dim);font-family:'Tenor Sans',sans-serif;font-size:.78rem;line-height:1.7;}

@media(max-width:960px){
  .video-grid{grid-template-columns:1fr 1fr;}
  .fp-info{grid-template-columns:1fr;}
  .fp-actions{flex-direction:row;flex-wrap:wrap;}
  .fp-action-btn{flex:1;min-width:140px;}
}
@media(max-width:640px){
  .video-grid{grid-template-columns:1fr;}
  .vd-drawer{width:100vw;border-left:none;border-top:1px solid rgba(212,175,120,.15);border-radius:20px 20px 0 0;top:auto;height:92vh;}
  .vd-backdrop.open ~ .vd-drawer{transform:translateX(0) translateY(0);}
}
</style>
</head>

<script>
'use strict';

/* ── SVG play icon ── */
const PLAY_SVG = `<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>`;

/* ── Drawer state ── */
let _items = [];
const backdrop  = document.getElementById('vdBackdrop');
const drawer    = document.getElementById('vdDrawer');
const vdPlayer  = document.getElementById('vdPlayer');
const vdBody    = document.getElementById('vdBody');

function closeDrawer() {
  drawer.classList.remove('open');
  backdrop.classList.remove('open');
  // Kill iframe to stop video playing
  vdPlayer.innerHTML = '';
  vdBody.innerHTML = '';
  document.body.style.overflow = '';
}

function openDrawer(idx) {
  const v = _items[idx];
  if (!v) return;

  /* ── Player area ── */
  if (v.embedUrl) {
    // Show thumbnail first, click to swap in iframe
    if (v.thumbnail) {
      vdPlayer.innerHTML = `
        <div class="vd-player-thumb">
          <img src="${escAttr(v.thumbnail)}" alt="${escAttr(v.title)}">
          <div class="vd-thumb-overlay"></div>
          <div class="vd-thumb-play" id="vd-load-embed">
            <div class="vd-thumb-play-btn">${PLAY_SVG}</div>
          </div>
        </div>`;
      document.getElementById('vd-load-embed').onclick = () => loadEmbed(v.embedUrl);
    } else {
      // No thumbnail — load iframe directly
      loadEmbed(v.embedUrl);
    }
  } else {
    vdPlayer.innerHTML = `
      <div class="vd-player-no-embed">
        <div class="vd-player-no-embed-icon">🎬</div>
        <div class="vd-player-no-embed-text">No embed URL set</div>
      </div>`;
  }

  /* ── Info body ── */
  const tags = (v.tags||[]).map(t => `<span class="tag-pill">${sanitizeHTML(t)}</span>`).join('');
  const links = (v.links||[]);

  let linksHTML = '';
  if (links.length) {
    linksHTML = `
      <div class="vd-links-label">Watch Links</div>
      <div class="vd-links">
        ${links.map(l => {
          const url = safeUrl(l.url);
          const domain = (() => { try { return new URL(l.url).hostname.replace('www.',''); } catch(e) { return l.url; } })();
          const icon = l.url.includes('youtube') ? '▶' : l.url.includes('vimeo') ? '◆' : l.url.includes('drive') ? '📁' : '🔗';
          return `<a class="vd-link" href="${escAttr(url)}" target="_blank" rel="noopener">
            <div class="vd-link-icon">${icon}</div>
            <div class="vd-link-text">
              <div class="vd-link-label">${sanitizeHTML(l.label || 'Watch Video')}</div>
              <div class="vd-link-url">${sanitizeHTML(domain)}</div>
            </div>
            <div class="vd-link-arrow">→</div>
          </a>`;
        }).join('')}
      </div>`;
  } else if (!v.embedUrl) {
    linksHTML = `<div class="vd-no-links">No links added yet.<br>Add them in the <a href="admin.html" style="color:var(--gold);">Admin panel →</a></div>`;
  }

  const embedBtnHTML = v.embedUrl ? `
    <button class="vd-embed-btn" id="vd-embed-toggle">
      ${PLAY_SVG} Play Embedded Video
    </button>` : '';

  vdBody.innerHTML = `
    <div class="vd-eyebrow">${sanitizeHTML(v.category || 'Video')}</div>
    <div class="vd-title">${sanitizeHTML(v.title)}</div>
    <div class="vd-meta-row">
      ${v.duration ? `<span class="vd-meta-chip">${sanitizeHTML(v.duration)}</span>` : ''}
      ${v.date     ? `<span class="vd-meta-chip">${sanitizeHTML(v.date)}</span>`     : ''}
    </div>
    ${embedBtnHTML}
    ${v.description ? `
      <div class="vd-desc-label">About this video</div>
      <div class="vd-desc">${sanitizeHTML(v.description)}</div>` : ''}
    ${tags ? `<div class="vd-hr"></div><div class="vd-tags-row">${tags}</div>` : ''}
    ${linksHTML ? `<div class="vd-hr"></div>${linksHTML}` : ''}`;

  // Embed toggle button
  const embedToggle = document.getElementById('vd-embed-toggle');
  if (embedToggle) embedToggle.onclick = () => loadEmbed(v.embedUrl);

  /* ── Open ── */
  drawer.classList.add('open');
  backdrop.classList.add('open');
  document.body.style.overflow = 'hidden';
}

function loadEmbed(embedUrl) {
  vdPlayer.innerHTML = `<iframe src="${escAttr(embedUrl)}" allowfullscreen allow="autoplay; encrypted-media; picture-in-picture"></iframe>`;
}

/* Close handlers */
document.getElementById('vdClose').onclick = closeDrawer;
backdrop.addEventListener('click', closeDrawer);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && drawer.classList.contains('open')) closeDrawer(); });

/* ════════════════════════════════
   FEATURED PLAYER (top of page)
════════════════════════════════ */
function renderFeatured(v, idx) {
  const featuredEl = document.getElementById('featured-section');
  if (!v) { featuredEl.innerHTML = ''; return; }

  const tags = (v.tags||[]).map(t => `<span class="tag-pill">${sanitizeHTML(t)}</span>`).join('');

  // Thumb / embed in featured stage
  let stageInner = '';
  if (v.thumbnail) {
    stageInner = `
      <img class="fp-thumb-cover" src="${escAttr(v.thumbnail)}" alt="${escAttr(v.title)}">
      <div class="fp-play-overlay" id="fp-play-overlay">
        <div class="fp-play-btn">${PLAY_SVG}</div>
      </div>`;
  } else if (v.embedUrl) {
    stageInner = `
      <div class="fp-no-thumb">
        <div class="fp-no-thumb-icon">🎬</div>
        <div class="fp-no-thumb-text">Click to play</div>
      </div>
      <div class="fp-play-overlay" id="fp-play-overlay">
        <div class="fp-play-btn">${PLAY_SVG}</div>
      </div>`;
  } else {
    stageInner = `
      <div class="fp-no-thumb">
        <div class="fp-no-thumb-icon">🎬</div>
        <div class="fp-no-thumb-text">No thumbnail set — add one in Admin</div>
      </div>`;
  }

  // Action buttons
  const links = (v.links||[]);
  const hasLinks = links.length > 0;
  const actionsHTML = hasLinks
    ? `<div class="fp-ext-links">
        ${links.map(l => `<a class="fp-ext-link" href="${escAttr(safeUrl(l.url))}" target="_blank" rel="noopener">▶ ${sanitizeHTML(l.label||'Watch')}</a>`).join('')}
        <button class="fp-action-secondary fp-action-btn" onclick="openDrawer(${idx})">
          ⓘ  Full Details
        </button>
      </div>`
    : `<div class="fp-actions">
        ${v.embedUrl ? `<button class="fp-action-primary fp-action-btn" id="fp-embed-btn">▶ Play Now</button>` : ''}
        <button class="fp-action-secondary fp-action-btn" onclick="openDrawer(${idx})">
          ⓘ  Details & Links
        </button>
      </div>`;

  featuredEl.innerHTML = `
    <div class="featured-player reveal">
      <div class="fp-stage" id="fp-stage">${stageInner}</div>
      <div class="fp-info">
        <div class="fp-info-left">
          <div class="fp-eyebrow">${sanitizeHTML(v.category || 'Video')}</div>
          <div class="fp-title">${sanitizeHTML(v.title)}</div>
          <div class="fp-meta">
            ${v.duration ? `<span class="fp-meta-item">${sanitizeHTML(v.duration)}</span>` : ''}
            ${v.date     ? `<span class="fp-meta-item">${sanitizeHTML(v.date)}</span>`     : ''}
          </div>
          ${v.description ? `<div class="fp-desc">${sanitizeHTML(v.description)}</div>` : ''}
          ${tags          ? `<div class="fp-tags">${tags}</div>`                         : ''}
        </div>
        ${actionsHTML}
      </div>
    </div>`;

  // Play overlay on featured → load iframe in place
  const fpOverlay = document.getElementById('fp-play-overlay');
  if (fpOverlay && v.embedUrl) {
    fpOverlay.onclick = () => {
      document.getElementById('fp-stage').innerHTML =
        `<iframe src="${escAttr(v.embedUrl)}" allowfullscreen allow="autoplay; encrypted-media; picture-in-picture" style="position:absolute;inset:0;width:100%;height:100%;border:none;"></iframe>`;
    };
  }
  const fpEmbedBtn = document.getElementById('fp-embed-btn');
  if (fpEmbedBtn && v.embedUrl) {
    fpEmbedBtn.onclick = () => {
      document.getElementById('fp-stage').innerHTML =
        `<iframe src="${escAttr(v.embedUrl)}" allowfullscreen allow="autoplay; encrypted-media; picture-in-picture" style="position:absolute;inset:0;width:100%;height:100%;border:none;"></iframe>`;
    };
  }
}

/* ════════════════════════════════
   GRID — remaining videos
════════════════════════════════ */
function renderGrid(items) {
  const gridEl = document.getElementById('grid-section');
  if (!items.length) { gridEl.innerHTML = ''; return; }

  gridEl.innerHTML = `
    <div class="section-eyebrow reveal">
      <span class="section-eyebrow-text">All Videos</span>
    </div>
    <div class="video-grid reveal" id="video-grid"></div>`;

  document.getElementById('video-grid').innerHTML = items.map((v, localIdx) => {
    // localIdx + 1 because index 0 is featured
    const globalIdx = localIdx + 1;
    const tags = (v.tags||[]).map(t => `<span class="tag-pill">${sanitizeHTML(t)}</span>`).join('');
    const thumb = v.thumbnail
      ? `<img src="${escAttr(v.thumbnail)}" alt="${escAttr(v.title)}">`
      : `<div class="vc-ph"><div class="vc-ph-icon">🎬</div><div class="vc-ph-text">No thumbnail</div></div>`;

    return `<article class="vc" onclick="openDrawer(${globalIdx})">
      <div class="vc-thumb">
        ${thumb}
        <div class="vc-thumb-gradient"></div>
        <div class="vc-play-ring">
          <div class="vc-play-circle">${PLAY_SVG}</div>
        </div>
        ${v.category ? `<div class="vc-cat-badge">${sanitizeHTML(v.category)}</div>` : ''}
        ${v.duration ? `<div class="vc-duration">${sanitizeHTML(v.duration)}</div>`  : ''}
      </div>
      <div class="vc-info">
        <div class="vc-title">${sanitizeHTML(v.title)}</div>
        ${v.description ? `<div class="vc-desc">${sanitizeHTML(v.description)}</div>` : ''}
        ${tags ? `<div class="vc-tags">${tags}</div>` : ''}
        <div class="vc-footer">
          <span class="vc-date">${sanitizeHTML(v.date||'')}</span>
          <span class="vc-watch">View ↗</span>
        </div>
      </div>
    </article>`;
  }).join('');
}

/* ── INIT ── */
async function init() {
  // Show loading state
  document.getElementById('featured-section').innerHTML = `
    <div style="height:400px;border-radius:20px;background:var(--glass);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;margin-bottom:4rem;">
      <div style="font-family:'Tenor Sans',sans-serif;font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--text-dim);">Loading…</div>
    </div>`;

  try {
    _items = await DB.video.getAll();
  } catch(err) {
    document.getElementById('featured-section').innerHTML = `
      <div style="text-align:center;padding:4rem;color:var(--text-dim);">
        <div style="font-size:1.5rem;margin-bottom:.8rem;opacity:.3;">⚠️</div>
        <div style="font-size:.82rem;">Could not load videos. Check your Supabase connection.</div>
      </div>`;
    return;
  }

  if (!_items.length) {
    document.getElementById('featured-section').innerHTML = `
      <div style="text-align:center;padding:6rem;color:var(--text-dim);">
        <div style="font-size:3rem;margin-bottom:1rem;opacity:.2;">🎬</div>
        <div style="font-size:.9rem;margin-bottom:.5rem;color:var(--text-muted);">No videos yet.</div>
        <a href="admin.html" style="color:var(--gold);font-size:.8rem;">Add some in the Admin panel →</a>
      </div>`;
    document.getElementById('grid-section').innerHTML = '';
    return;
  }

  // First item → featured large player
  renderFeatured(_items[0], 0);
  // Rest → grid
  renderGrid(_items.slice(1));
}

init();
</script>
</body>
</html>
