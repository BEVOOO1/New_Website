<style>
.hero-orb-v{width:700px;height:700px;background:radial-gradient(circle,rgba(56,200,130,.07) 0%,transparent 70%);top:-180px;left:-220px;animation:vd 18s ease-in-out infinite alternate;}
.hero-orb-v2{width:380px;height:380px;background:radial-gradient(circle,rgba(212,175,120,.06) 0%,transparent 70%);bottom:0;right:8%;animation:vd2 13s ease-in-out infinite alternate;}
@keyframes vd{from{transform:translate(0,0);}to{transform:translate(35px,25px);}}
@keyframes vd2{from{transform:translate(0,0);}to{transform:translate(-20px,15px);}}

/* ═══ VIDEO GRID ═══ */
.video-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.4rem;}
.vc{border-radius:18px;overflow:hidden;background:var(--glass-deep);border:1px solid var(--border);cursor:pointer;transition:border-color .4s,transform .4s,box-shadow .4s;display:flex;flex-direction:column;}
.vc:hover{border-color:var(--border-gold);transform:translateY(-7px);box-shadow:0 30px 80px rgba(0,0,0,.6);}

/* Featured first card spans full width */
.vc:first-child{grid-column:1/-1;flex-direction:row;}
.vc:first-child .vc-thumb{aspect-ratio:unset;min-height:300px;flex:1.55;}
.vc:first-child .vc-info{flex:1;padding:2.4rem 2rem;justify-content:center;}
.vc:first-child .vc-title{font-size:1.55rem;}
.vc:first-child .vc-desc{-webkit-line-clamp:4;}

/* Thumbnail */
.vc-thumb{position:relative;aspect-ratio:16/9;background:linear-gradient(135deg,#090b15,#0e1220);overflow:hidden;flex-shrink:0;}
.vc-thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .55s cubic-bezier(.23,1,.32,1);}
.vc:hover .vc-thumb img{transform:scale(1.06);}
.vc-thumb-grad{position:absolute;bottom:0;left:0;right:0;height:65%;background:linear-gradient(to top,rgba(7,8,15,.8),transparent);pointer-events:none;}
.vc-badge{position:absolute;top:.75rem;left:.75rem;background:rgba(7,8,15,.75);backdrop-filter:blur(10px);border:1px solid rgba(212,175,120,.22);font-family:'Tenor Sans',sans-serif;font-size:.55rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);padding:.22rem .6rem;border-radius:5px;}
.vc-dur{position:absolute;bottom:.75rem;right:.75rem;background:rgba(7,8,15,.82);backdrop-filter:blur(8px);font-family:'Tenor Sans',sans-serif;font-size:.58rem;color:rgba(240,236,228,.7);padding:.2rem .55rem;border-radius:4px;}
.vc-play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(7,8,15,0);transition:background .35s;}
.vc:hover .vc-play{background:rgba(7,8,15,.45);}
.vc-play-ring{width:58px;height:58px;border-radius:50%;background:rgba(212,175,120,.14);border:2px solid rgba(212,175,120,.45);display:flex;align-items:center;justify-content:center;opacity:0;transform:scale(.8);transition:all .35s cubic-bezier(.23,1,.32,1);backdrop-filter:blur(12px);}
.vc:hover .vc-play-ring{opacity:1;transform:scale(1);}
.vc-play-ring svg{width:22px;height:22px;fill:var(--gold);margin-left:3px;}
.vc-ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.6rem;}
.vc-ph-icon{font-size:2rem;opacity:.15;}
.vc-ph-txt{font-family:'Tenor Sans',sans-serif;font-size:.58rem;letter-spacing:.12em;text-transform:uppercase;color:var(--text-dim);}

/* Info */
.vc-info{padding:1.35rem 1.5rem 1.55rem;display:flex;flex-direction:column;flex:1;}
.vc-eyebrow{font-family:'Tenor Sans',sans-serif;font-size:.58rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-bottom:.45rem;display:flex;align-items:center;gap:.45rem;}
.vc-eyebrow::before{content:'';width:12px;height:1px;background:var(--gold);}
.vc-title{font-family:'Playfair Display',serif;font-size:1rem;font-weight:400;line-height:1.3;color:var(--text);margin-bottom:.45rem;}
.vc-desc{font-family:'Tenor Sans',sans-serif;font-size:.74rem;line-height:1.75;color:var(--text-dim);margin-bottom:.8rem;flex:1;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.vc-tags{display:flex;gap:.35rem;flex-wrap:wrap;margin-bottom:.85rem;}
.vc-footer{display:flex;align-items:center;justify-content:space-between;margin-top:auto;}
.vc-date{font-family:'Tenor Sans',sans-serif;font-size:.62rem;color:var(--text-dim);}
.vc-cta{font-family:'Tenor Sans',sans-serif;font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);opacity:.65;transition:opacity .2s;}
.vc:hover .vc-cta{opacity:1;}

/* ═══════════════════════════════════════════════
   FULL-SCREEN VIDEO LIGHTBOX  (matches design.html pattern)
═══════════════════════════════════════════════ */
.vlb{
  position:fixed;inset:0;z-index:800;
  background:rgba(4,5,12,.97);
  backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);
  display:none;
  flex-direction:column;
  align-items:center;justify-content:center;
  padding:1rem;
}
.vlb.open{display:flex;}

/* Close */
.vlb-close{
  position:fixed;top:1.4rem;right:1.4rem;
  width:46px;height:46px;border-radius:50%;
  background:rgba(255,255,255,.08);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;color:var(--text-muted);font-size:1.1rem;transition:all .2s;z-index:10;
}
.vlb-close:hover{background:rgba(255,255,255,.15);color:var(--text);}

/* Side nav arrows */
.vlb-nav{
  position:fixed;top:50%;transform:translateY(-50%);
  background:rgba(255,255,255,.07);border:1px solid var(--border);
  border-radius:50%;width:46px;height:46px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;color:var(--text-muted);font-size:1.1rem;transition:all .2s;z-index:10;
}
.vlb-nav:hover{background:rgba(255,255,255,.15);color:var(--gold);}
#vlbPrev{left:1.2rem;}
#vlbNext{right:1.2rem;}

/* Video container — 16:9, centred, max 88vw */
.vlb-video-wrap{
  width:min(1080px,88vw);
  position:relative;
}
.vlb-video-wrap::after{content:'';display:block;padding-bottom:56.25%;}
.vlb-video-wrap iframe{
  position:absolute;inset:0;width:100%;height:100%;
  border:none;border-radius:14px;
  box-shadow:0 30px 100px rgba(0,0,0,.85);
}
/* Thumbnail state before play */
.vlb-thumb-state{
  position:absolute;inset:0;border-radius:14px;overflow:hidden;
  background:#060810;cursor:pointer;
}
.vlb-thumb-state img{width:100%;height:100%;object-fit:cover;display:block;}
.vlb-thumb-btn{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;
  background:rgba(7,8,15,.3);transition:background .3s;
}
.vlb-thumb-btn:hover{background:rgba(7,8,15,.52);}
.vlb-thumb-ring{
  width:88px;height:88px;border-radius:50%;
  background:rgba(212,175,120,.16);border:2px solid rgba(212,175,120,.55);
  display:flex;align-items:center;justify-content:center;
  backdrop-filter:blur(16px);transition:all .35s;
}
.vlb-thumb-ring svg{width:30px;height:30px;fill:var(--gold);margin-left:5px;}
.vlb-thumb-btn:hover .vlb-thumb-ring{background:rgba(212,175,120,.3);transform:scale(1.1);box-shadow:0 0 60px rgba(212,175,120,.35);}
.vlb-thumb-label{font-family:'Tenor Sans',sans-serif;font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;color:rgba(212,175,120,.8);}
/* No embed placeholder */
.vlb-no-embed{
  position:absolute;inset:0;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;
  background:linear-gradient(135deg,#090b16,#0c0f1c);
}
.vlb-no-embed-icon{font-size:3rem;opacity:.15;}
.vlb-no-embed-txt{font-family:'Tenor Sans',sans-serif;font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--text-dim);}

/* Info bar below the video */
.vlb-info{
  width:min(1080px,88vw);
  margin-top:1.4rem;
  display:flex;align-items:flex-start;justify-content:space-between;gap:2rem;
  flex-wrap:wrap;
}
.vlb-meta{flex:1;min-width:0;}
.vlb-title{font-family:'Playfair Display',serif;font-size:1.35rem;font-weight:400;color:var(--text);margin-bottom:.3rem;}
.vlb-sub{display:flex;align-items:center;gap:.8rem;flex-wrap:wrap;}
.vlb-cat{font-family:'Tenor Sans',sans-serif;font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);}
.vlb-dur{font-family:'Tenor Sans',sans-serif;font-size:.62rem;color:var(--text-dim);}
.vlb-desc{font-family:'Tenor Sans',sans-serif;font-size:.8rem;line-height:1.8;color:var(--text-dim);margin-top:.6rem;max-width:680px;}
.vlb-counter{font-family:'Tenor Sans',sans-serif;font-size:.62rem;letter-spacing:.1em;color:var(--text-dim);white-space:nowrap;flex-shrink:0;margin-top:.25rem;}

/* External watch links below info */
.vlb-links{width:min(1080px,88vw);margin-top:.9rem;display:flex;gap:.6rem;flex-wrap:wrap;}
.vlb-link{
  display:inline-flex;align-items:center;gap:.5rem;
  padding:.45rem 1rem;border-radius:8px;
  border:1px solid rgba(212,175,120,.2);background:rgba(212,175,120,.04);
  text-decoration:none;color:var(--gold);
  font-family:'Tenor Sans',sans-serif;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;
  transition:all .25s;
}
.vlb-link:hover{border-color:var(--border-gold);background:rgba(212,175,120,.1);}

/* responsive in shared.css */

<!-- ═══════════════════════════ FULL-SCREEN LIGHTBOX ═══════════════════════════ -->
<div class="vlb" id="vlb">
  <button class="vlb-close" id="vlbClose">✕</button>
  <button class="vlb-nav" id="vlbPrev">‹</button>
  <button class="vlb-nav" id="vlbNext">›</button>

  <!-- Video player area -->
  <div class="vlb-video-wrap" id="vlbVideoWrap"></div>

  <!-- Title / meta -->
  <div class="vlb-info">
    <div class="vlb-meta">
      <div class="vlb-title" id="vlbTitle"></div>
      <div class="vlb-sub">
        <span class="vlb-cat"  id="vlbCat"></span>
        <span class="vlb-dur"  id="vlbDur"></span>
      </div>
      <div class="vlb-desc" id="vlbDesc"></div>
    </div>
    <div class="vlb-counter" id="vlbCounter"></div>
  </div>

  <!-- External watch links row -->
  <div class="vlb-links" id="vlbLinks"></div>
</div>

<script src="db.js"></script>
<script src="shared.js"></script>
<script>
'use strict';

const PLAY_SVG = `<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>`;
let _items = [];
let _lbIdx = 0;

/* ══ LIGHTBOX ══ */
const vlb = document.getElementById('vlb');

function openLightbox(idx) {
  _lbIdx = idx;
  renderLb();
  vlb.classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeLightbox() {
  vlb.classList.remove('open');
  document.body.style.overflow = '';
  // Clear iframe to stop video playback
  document.getElementById('vlbVideoWrap').innerHTML = '';
}

function renderLb() {
  const v = _items[_lbIdx];
  if (!v) return;

  // ── Video area ──
  const wrap = document.getElementById('vlbVideoWrap');
  if (v.embedUrl && v.thumbnail) {
    // Thumbnail first — click to load embed
    wrap.innerHTML = `
      <div class="vlb-thumb-state" id="vlbThumb">
        <img src="${escAttr(v.thumbnail)}" alt="${escAttr(v.title)}">
        <div class="vlb-thumb-btn" onclick="loadEmbed(${_lbIdx})">
          <div class="vlb-thumb-ring">${PLAY_SVG}</div>
          <div class="vlb-thumb-label">Play Video</div>
        </div>
      </div>`;
  } else if (v.embedUrl) {
    loadEmbedDirect(v.embedUrl);
  } else {
    wrap.innerHTML = `
      <div class="vlb-no-embed">
        <div class="vlb-no-embed-icon">🎬</div>
        <div class="vlb-no-embed-txt">No embed URL — see links below</div>
      </div>`;
  }

  // ── Info ──
  document.getElementById('vlbTitle').textContent   = v.title || '';
  document.getElementById('vlbCat').textContent     = v.category || '';
  document.getElementById('vlbDur').textContent     = v.duration ? '⏱ ' + v.duration : '';
  document.getElementById('vlbDesc').textContent    = v.description || '';
  document.getElementById('vlbCounter').textContent = `${_lbIdx + 1} / ${_items.length}`;

  // Nav arrows
  document.getElementById('vlbPrev').style.display = _items.length > 1 ? '' : 'none';
  document.getElementById('vlbNext').style.display = _items.length > 1 ? '' : 'none';

  // ── External links ──
  const linksEl = document.getElementById('vlbLinks');
  const links   = v.links || [];
  if (links.length) {
    linksEl.innerHTML = links.map(l => {
      const url  = safeUrl(l.url);
      const icon = l.url.includes('youtube') ? '▶' : l.url.includes('vimeo') ? '◆' : l.url.includes('drive') ? '📁' : '↗';
      return `<a class="vlb-link" href="${escAttr(url)}" target="_blank" rel="noopener">${icon} ${sanitizeHTML(l.label || 'Watch')}</a>`;
    }).join('');
  } else {
    linksEl.innerHTML = '';
  }
}

function loadEmbed(idx) {
  const v = _items[idx];
  if (!v?.embedUrl) return;
  loadEmbedDirect(v.embedUrl);
}

function loadEmbedDirect(url) {
  if (!isSafeEmbedUrl(url)) {
    document.getElementById('vlbVideoWrap').innerHTML =
      `<div class="vlb-no-embed"><div class="vlb-no-embed-icon">⚠️</div><div class="vlb-no-embed-txt">Unsupported embed source</div></div>`;
    return;
  }
  document.getElementById('vlbVideoWrap').innerHTML =
    `<iframe src="${escAttr(url)}" allowfullscreen allow="autoplay; encrypted-media; picture-in-picture"></iframe>`;
}

function navLb(dir) {
  // Stop current video first
  document.getElementById('vlbVideoWrap').innerHTML = '';
  _lbIdx = (_lbIdx + dir + _items.length) % _items.length;
  renderLb();
}

document.getElementById('vlbClose').onclick = closeLightbox;
document.getElementById('vlbPrev').onclick   = e => { e.stopPropagation(); navLb(-1); };
document.getElementById('vlbNext').onclick   = e => { e.stopPropagation(); navLb(+1); };
vlb.addEventListener('click', e => { if (e.target === vlb) closeLightbox(); });
document.addEventListener('keydown', e => {
  if (!vlb.classList.contains('open')) return;
  if (e.key === 'Escape')      closeLightbox();
  if (e.key === 'ArrowLeft')   navLb(-1);
  if (e.key === 'ArrowRight')  navLb(+1);
});

/* ══ RENDER CARDS ══ */
async function init() {
  _items = await DB.video.getAll();
  const el = document.getElementById('video-grid');

  if (!_items.length) {
    el.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:5rem;color:var(--text-dim);">
      <div style="font-size:2.5rem;margin-bottom:1rem;opacity:.2;">🎬</div>
      <div style="font-size:.85rem;">No videos yet. <a href="admin.html" style="color:var(--gold);">Add some in Admin →</a></div>
    </div>`;
    return;
  }

  el.innerHTML = _items.map((v, i) => {
    const tags  = (v.tags || []).map(t => `<span class="tag-pill">${sanitizeHTML(t)}</span>`).join('');
    const thumb = v.thumbnail
      ? `<img src="${escAttr(v.thumbnail)}" alt="${escAttr(v.title)}">`
      : `<div class="vc-ph"><div class="vc-ph-icon">🎬</div><div class="vc-ph-txt">No thumbnail</div></div>`;

    return `<article class="vc" onclick="openLightbox(${i})">
      <div class="vc-thumb">
        ${thumb}
        <div class="vc-thumb-grad"></div>
        ${v.category ? `<div class="vc-badge">${sanitizeHTML(v.category)}</div>` : ''}
        ${v.duration  ? `<div class="vc-dur">${sanitizeHTML(v.duration)}</div>` : ''}
        <div class="vc-play"><div class="vc-play-ring">${PLAY_SVG}</div></div>
      </div>
      <div class="vc-info">
        <div class="vc-eyebrow">${sanitizeHTML(v.category || 'Video')}</div>
        <div class="vc-title">${sanitizeHTML(v.title)}</div>
        ${v.description ? `<div class="vc-desc">${sanitizeHTML(v.description)}</div>` : ''}
        ${tags ? `<div class="vc-tags">${tags}</div>` : ''}
        <div class="vc-footer">
          <span class="vc-date">${sanitizeHTML(v.date || '')}</span>
          <span class="vc-cta">Watch ${v.embedUrl ? '▶' : '↗'}</span>
        </div>
      </div>
    </article>`;
  }).join('');
}

init();
</script>
