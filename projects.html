<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Projects — Bavly Badr</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=Tenor+Sans&family=Cinzel:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
.hero-orb-p{width:650px;height:650px;background:radial-gradient(circle,rgba(167,139,250,.09) 0%,transparent 70%);top:-150px;left:-150px;animation:pd 16s ease-in-out infinite alternate;}
@keyframes pd{from{transform:translate(0,0);}to{transform:translate(35px,25px);}}

/* PROJECT CARD */
.project-card{border-radius:var(--radius-lg);overflow:hidden;border:1px solid var(--border);background:var(--glass-deep);transition:all .45s cubic-bezier(.23,1,.32,1);margin-bottom:2rem;}
.project-card:hover{border-color:var(--border-gold);box-shadow:0 30px 90px rgba(0,0,0,.5);}

/* Header row */
.p-header{display:grid;grid-template-columns:80px 1fr;border-bottom:1px solid var(--border);}
.p-icon-col{display:flex;align-items:center;justify-content:center;font-size:2.2rem;background:var(--glass);border-right:1px solid var(--border);padding:2rem 0;transition:background .3s;}
.project-card:hover .p-icon-col{background:rgba(212,175,120,.05);}
.p-header-info{padding:2rem 2.5rem;}
.p-status{display:inline-flex;align-items:center;gap:.5rem;font-family:'Tenor Sans',sans-serif;font-size:.65rem;letter-spacing:.15em;text-transform:uppercase;padding:.3rem .9rem;border-radius:100px;margin-bottom:.8rem;border:1px solid;width:fit-content;}
.p-status.live{color:#38d9a9;border-color:rgba(56,217,169,.3);background:rgba(56,217,169,.06);}
.p-status.live::before{content:'';width:6px;height:6px;border-radius:50%;background:#38d9a9;box-shadow:0 0 8px #38d9a9;animation:blink 2s ease infinite;}
.p-status.complete{color:var(--gold);border-color:var(--border-gold);background:rgba(212,175,120,.06);}
.p-status.complete::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--gold);}
.p-status.progress{color:#60a5fa;border-color:rgba(96,165,250,.3);background:rgba(96,165,250,.06);}
.p-status.progress::before{content:'';width:6px;height:6px;border-radius:50%;background:#60a5fa;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:.4;}}
.p-title{font-family:'Playfair Display',serif;font-size:clamp(1.4rem,2.5vw,1.9rem);font-weight:400;color:var(--text);margin-bottom:.25rem;}
.p-subtitle{font-family:'Tenor Sans',sans-serif;font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:var(--gold-dim);}

/* Body */
.p-body{padding:2rem 2.5rem;}
.p-desc{font-family:'Tenor Sans',sans-serif;font-size:.84rem;line-height:1.85;color:var(--text-dim);margin-bottom:1.5rem;max-width:780px;}
.p-feats{list-style:none;margin-bottom:1.5rem;display:flex;flex-direction:column;gap:.45rem;}
.p-feats li{font-size:.78rem;color:var(--text-muted);display:flex;align-items:flex-start;gap:.7rem;line-height:1.5;}
.p-feats li::before{content:'→';color:var(--gold);flex-shrink:0;}
.p-tech{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1.5rem;}

/* LINKS ROW */
.p-links-row{display:flex;gap:.6rem;flex-wrap:wrap;margin-bottom:1.5rem;}
.p-link{display:inline-flex;align-items:center;gap:.45rem;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--gold-dim);text-decoration:none;border:1px solid var(--border-gold);border-radius:8px;padding:.4rem 1rem;transition:all .25s;background:rgba(212,175,120,.04);}
.p-link:hover{color:var(--gold);background:rgba(212,175,120,.1);border-color:var(--border-glow);}
.p-link.github{color:#a0c4ff;border-color:rgba(160,196,255,.3);background:rgba(160,196,255,.04);}
.p-link.github:hover{color:#c8dcff;background:rgba(160,196,255,.1);border-color:rgba(160,196,255,.4);}
.p-link.pdf{color:#ff9f7a;border-color:rgba(255,159,122,.3);background:rgba(255,159,122,.04);}
.p-link.pdf:hover{color:#ffb899;background:rgba(255,159,122,.1);}

/* IMAGE GALLERY */
.p-gallery{display:grid;grid-template-columns:repeat(4,1fr);gap:.8rem;margin-bottom:1.5rem;}
.p-gallery-item{aspect-ratio:4/3;border-radius:10px;overflow:hidden;background:var(--glass);border:1px solid var(--border);cursor:pointer;transition:all .35s;}
.p-gallery-item:hover{border-color:var(--border-gold);transform:scale(1.02);}
.p-gallery-item img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s;}
.p-gallery-item:hover img{transform:scale(1.05);}
.p-gallery-item.more{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:.3rem;background:rgba(212,175,120,.05);border:1px dashed var(--border-gold);cursor:pointer;}
.p-gallery-more-num{font-family:'Cinzel',serif;font-size:1.2rem;color:var(--gold);}
.p-gallery-more-txt{font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;color:var(--gold-dim);}

/* EXTRA LINKS (custom) */
.p-extra-links{display:flex;gap:.5rem;flex-wrap:wrap;}
.p-extra-link{display:inline-flex;align-items:center;gap:.4rem;font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted);text-decoration:none;border:1px solid var(--border);border-radius:8px;padding:.4rem 1rem;transition:all .25s;}
.p-extra-link:hover{color:var(--gold);border-color:var(--border-gold);background:rgba(212,175,120,.06);}

/* LIGHTBOX */
#proj-lightbox{position:fixed;inset:0;z-index:1000;background:rgba(7,8,15,.96);backdrop-filter:blur(24px);display:none;align-items:center;justify-content:center;padding:2rem;}
#proj-lightbox.open{display:flex;}
#proj-lightbox img{max-width:90vw;max-height:88vh;border-radius:14px;box-shadow:0 30px 100px rgba(0,0,0,.8);border:1px solid rgba(212,175,120,.2);object-fit:contain;}
.plb-close{position:fixed;top:2rem;right:2rem;background:rgba(255,255,255,.08);border:1px solid var(--border);border-radius:50%;width:44px;height:44px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-muted);font-size:1.2rem;transition:all .2s;}
.plb-close:hover{background:rgba(255,255,255,.14);color:var(--text);}

@media(max-width:768px){
  .p-header{grid-template-columns:60px 1fr;}
  .p-header-info,.p-body{padding:1.5rem;}
  .p-gallery{grid-template-columns:repeat(2,1fr);}
}
</style>
</head>
<body>

<section class="page-hero"><div class="page-hero-bg"><div class="page-hero-orb hero-orb-p"></div></div>
  <div class="wrapper">
    <div class="section-label" style="animation:fadeUp .6s ease both;">Engineering</div>
    <h1 class="section-title" style="font-size:clamp(3rem,6vw,5rem);animation:fadeUp .7s .1s ease both;">Software<br><em>Projects</em></h1>
    <p style="font-size:.88rem;line-height:1.9;color:var(--text-dim);max-width:480px;margin-top:1.5rem;animation:fadeUp .7s .2s ease both;">Systems built to function in the real world — from architecture to live deployment.</p>
  </div>
</section>

<section style="padding:5rem 0 8rem;"><div class="wrapper">
  <div id="projects-list" class="reveal"></div>
</div></section>

  </div>
</div></footer>

<!-- LIGHTBOX -->
<div id="proj-lightbox">
  <button class="plb-close" id="plb-close">✕</button>
  <img id="plb-img" src="" alt="">
</div>

<script src="db.js"></script><script src="shared.js"></script>
<script>
function openProjLightbox(src) {
  document.getElementById('plb-img').src = src;
  document.getElementById('proj-lightbox').classList.add('open');
}
document.getElementById('plb-close').onclick = () => document.getElementById('proj-lightbox').classList.remove('open');
document.getElementById('proj-lightbox').addEventListener('click', function(e) { if (e.target === this) this.classList.remove('open'); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') document.getElementById('proj-lightbox').classList.remove('open'); });

async function init() {
  const items = await DB.projects.getAll();
  const el = document.getElementById('projects-list');
  if (!items.length) {
    el.innerHTML = `<div style="text-align:center;padding:4rem;color:var(--text-dim);">
      <div style="font-size:2rem;margin-bottom:.8rem;opacity:.3;">⚙️</div>
      <div style="font-size:.82rem;">No projects yet. <a href="admin.html" style="color:var(--gold);">Add some in Admin →</a></div>
    </div>`; return;
  }

  el.innerHTML = items.map(p => {
    const feats = (p.features||[]).map(f=>`<li>${f}</li>`).join('');
    const tags = (p.techStack||[]).map(t=>`<span class="tag-pill">${t}</span>`).join('');

    // Main links row
    const mainLinks = [
      p.links?.github ? `<a class="p-link github" href="${p.links.github}" target="_blank">🐙 GitHub</a>` : '',
      p.links?.live   ? `<a class="p-link" href="${p.links.live}" target="_blank">🌐 Live Site</a>` : '',
      p.links?.demo   ? `<a class="p-link" href="${p.links.demo}" target="_blank">▶ Demo</a>` : '',
    ].filter(Boolean).join('');

    // PDFs
    const pdfLinks = (p.pdfs||[]).map(pdf =>
      `<a class="p-link pdf" href="${pdf.url}" target="_blank">📄 ${pdf.label||'Document'}</a>`
    ).join('');

    // Extra custom links
    const extraLinks = (p.extraLinks||[]).map(lnk =>
      `<a class="p-extra-link" href="${lnk.url}" target="_blank">${lnk.label||lnk.url}</a>`
    ).join('');

    // Image gallery (max 4 shown + overflow count)
    let galleryHTML = '';
    const images = p.images || [];
    if (images.length > 0) {
      const shown = images.slice(0, 4);
      const rest = images.length - 4;
      galleryHTML = `<div class="p-gallery">
        ${shown.map((img, idx) => `<div class="p-gallery-item" onclick="openProjLightbox('${img.url||img}')">
          <img src="${img.url||img}" alt="${img.label||'Project screenshot'}" loading="lazy">
        </div>`).join('')}
        ${rest > 0 ? `<div class="p-gallery-item more" onclick="openProjLightbox('${images[4].url||images[4]}')">
          <div class="p-gallery-more-num">+${rest}</div>
          <div class="p-gallery-more-txt">more</div>
        </div>` : ''}
      </div>`;
    }

    const allLinks = mainLinks + pdfLinks;
    const hasLinks = allLinks || extraLinks;

    return `<div class="project-card">
      <div class="p-header">
        <div class="p-icon-col">${p.icon||'⚙️'}</div>
        <div class="p-header-info">
          <span class="p-status ${p.status||'complete'}">${p.statusLabel||p.status||'Completed'}</span>
          <div class="p-title">${p.title}</div>
          <div class="p-subtitle">${p.subtitle||''}</div>
        </div>
      </div>
      <div class="p-body">
        <div class="p-desc">${p.description||''}</div>
        ${feats ? `<ul class="p-feats">${feats}</ul>` : ''}
        ${tags ? `<div class="p-tech">${tags}</div>` : ''}
        ${galleryHTML}
        ${hasLinks ? `<div class="p-links-row">${allLinks}</div>` : ''}
        ${extraLinks ? `<div class="p-extra-links">${extraLinks}</div>` : ''}
      </div>
    </div>`;
  }).join('');
}
init();
</script>
